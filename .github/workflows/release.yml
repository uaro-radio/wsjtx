name: Release

on:
  workflow_dispatch:
    inputs:
      rc_number:
        description: "Release candidate number (blank for a finished release)"
        type: string
        default: ""
      dry_run:
        description: "Build everything, but do not tag and do not publish"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # ── Derive the version string once, from the source ───────────────
  # Never from a hand-typed tag: this workflow creates the tag itself, once the
  # builds are green, so there is nothing to type and nothing that can
  # disagree. CMakeLists.txt VERSION gives the numeric base and WSJT_FORK_TAG
  # the marker that says whose build it is; an rc_number input makes the run a
  # release candidate instead. All downstream jobs consume this single output,
  # so the platform artifacts cannot disagree with each other.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      release_channel: ${{ steps.v.outputs.release_channel }}
      rc_number: ${{ steps.v.outputs.rc_number }}
    steps:
      - uses: actions/checkout@v6
      - id: v
        env:
          RC_INPUT: ${{ inputs.rc_number }}
        run: |
          CMAKE_VERSION=$(sed -nE 's/^[[:space:]]*VERSION[[:space:]]+([0-9][0-9.]*).*/\1/p' CMakeLists.txt | head -1)
          NUMERIC=$(echo "$CMAKE_VERSION" | awk -F. '{printf "%s.%s.%s", $1, $2, $3}')
          FORK_TAG=$(sed -nE 's/^[[:space:]]*set \(WSJT_FORK_TAG "([^"]*)".*/\1/p' CMakeLists.txt | head -1)

          if [ -z "$CMAKE_VERSION" ]; then
            echo "::error::Could not read VERSION out of CMakeLists.txt."
            exit 1
          fi

          RC_NUMBER="$(echo "$RC_INPUT" | tr -d '[:space:]')"
          if [ -n "$RC_NUMBER" ]; then
            # A release candidate: numbered, flagged as a pre-release on the
            # page, and deliberately without the fork marker. An rc is for field
            # testing, not a finished build somebody should find under "Latest".
            case "$RC_NUMBER" in
              *[!0-9]*) echo "::error::rc_number must be a positive integer, got '$RC_INPUT'."; exit 1 ;;
            esac
            VERSION="${NUMERIC}-rc${RC_NUMBER}"
            RELEASE_CHANNEL=RC
          elif [ -n "$FORK_TAG" ]; then
            # A finished release of this fork: upstream's version plus the fork
            # marker that CMakeLists.txt carries in WSJT_FORK_TAG. Built on the
            # GA channel because it is a finished build and should not nag the
            # operator about being a development one — the marker in the version
            # is what says whose build it is.
            VERSION="${NUMERIC}-${FORK_TAG}"
            RELEASE_CHANNEL=GA
          else
            VERSION="$NUMERIC"
            RELEASE_CHANNEL=GA
          fi

          echo "version: $VERSION ($RELEASE_CHANNEL)"
          echo "commit:  $GITHUB_SHA"
          {
            echo "version=$VERSION"
            echo "tag=build/v$VERSION"
            echo "release_channel=$RELEASE_CHANNEL"
            echo "rc_number=$RC_NUMBER"
          } >> "$GITHUB_OUTPUT"

      # Fail here rather than after half an hour of builds on six runners. A
      # version that is already tagged means the release commit forgot to bump
      # CMakeLists.txt VERSION or WSJT_FORK_TAG, and finishing the run would
      # either clobber a published release or die at the last step with every
      # installer already paid for.
      - name: Refuse a version that is already released
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG already exists. Bump CMakeLists.txt VERSION or WSJT_FORK_TAG and commit that first."
            exit 1
          fi
          echo "  ok  $TAG is free"

      # The release page is written before the release, not after: the notes are
      # read from the commit being built, so editing them later changes nothing
      # that anyone downloading this version will ever see.
      - name: Verify the release notes exist in both languages
        run: |
          NOTES=.uaham/release-notes.md
          [ -f "$NOTES" ] || { echo "::error::$NOTES is missing — write it before releasing."; exit 1; }
          grep -q '^# English' "$NOTES" \
            || { echo "::error::$NOTES has no '# English' section. Release notes are written in both languages, in full — see AGENTS.md."; exit 1; }
          echo "  ok  $NOTES, $(wc -l < "$NOTES") lines, both languages present"

  # ── Build all five platforms ───────────────────────────────────────
  macos-arm64-qt:
    needs: prepare
    uses: ./.github/workflows/prepare-macos-qt.yml
    with:
      arch: "arm64"
      runner: "macos-15"
      deployment_target: "11.0"

  macos-intel-qt:
    needs: prepare
    uses: ./.github/workflows/prepare-macos-qt.yml
    with:
      arch: "x86_64"
      runner: "macos-15-intel"
      deployment_target: "10.13"

  macos:
    needs: [prepare, macos-arm64-qt]
    uses: ./.github/workflows/build-macos.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      hamlib_branch: "4.7.1"
      arch: "arm64"
      runner: "macos-15"
      deployment_target: "11.0"
      release_channel: ${{ needs.prepare.outputs.release_channel }}
      rc_number: ${{ needs.prepare.outputs.rc_number }}
    secrets: inherit

  macos-intel:
    needs: [prepare, macos-intel-qt]
    uses: ./.github/workflows/build-macos.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      hamlib_branch: "4.7.1"
      arch: "x86_64"
      release_channel: ${{ needs.prepare.outputs.release_channel }}
      rc_number: ${{ needs.prepare.outputs.rc_number }}
      runner: "macos-15-intel"
      deployment_target: "10.13"
    secrets: inherit

  linux:
    needs: prepare
    uses: ./.github/workflows/build-linux.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      hamlib_branch: "4.7.1"
      arch: "x86_64"
      release_channel: ${{ needs.prepare.outputs.release_channel }}
      rc_number: ${{ needs.prepare.outputs.rc_number }}
    secrets: inherit

  linux-arm:
    needs: prepare
    uses: ./.github/workflows/build-linux.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      hamlib_branch: "4.7.1"
      arch: "aarch64"
      release_channel: ${{ needs.prepare.outputs.release_channel }}
      rc_number: ${{ needs.prepare.outputs.rc_number }}
    secrets: inherit

  windows:
    needs: prepare
    uses: ./.github/workflows/build-windows.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      hamlib_branch: "4.7.1"
      release_channel: ${{ needs.prepare.outputs.release_channel }}
      rc_number: ${{ needs.prepare.outputs.rc_number }}
    secrets: inherit

  # ── Publish release + sync to public repo ──────────────────────────
  release:
    needs: [prepare, macos, macos-intel, linux, linux-arm, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      # Source tarball is published on GA releases only, not on RC (-rc*,
      # -beta*, etc.) pre-releases. Rationale: RCs may carry code for features
      # that are not yet intended for open source distribution (limited-access
      # field testing). GA releases always include a source tarball per the
      # CI/CD adoption decision on platform-matrix assets.
      - name: Build source tarball (GA only)
        if: ${{ !contains(needs.prepare.outputs.version, '-') }}
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # This repo has no git submodules, so git archive's default
          # single-tree output captures the full source. If submodules
          # are ever added, this step must be revisited — git archive
          # does not recurse into submodules on its own.
          git archive \
            --format=tar.gz \
            --prefix="wsjtx-${VERSION}/" \
            -o "artifacts/wsjtx-${VERSION}-src.tar.gz" \
            "${GITHUB_SHA}"
          ls -lh "artifacts/wsjtx-${VERSION}-src.tar.gz"

      - name: List artifacts
        run: find artifacts -type f | sort

      # ── All-platforms-ready gate ───────────────────────────────────────
      # Refuse to publish unless every platform produced an installer-grade
      # artifact. The release job's `needs:` already enforces structural
      # success (all 5 builds ran and exited 0), but a build can exit 0
      # without actually packaging — e.g. a packaging step behind an `if:`
      # that evaluated false, or an upload-artifact step that silently
      # matched zero files. This gate fails the release job BEFORE any
      # asset upload so partial releases never reach GitHub Releases or
      # the public mirror.
      #
      # Expected artifact layout (one installer per platform, per the
      # five build-*.yml upload-artifact steps):
      #   artifacts/wsjtx-<ver>-arm64-macOS.pkg/*.pkg
      #   artifacts/wsjtx-<ver>-x86_64-macOS.pkg/*.pkg
      #   artifacts/wsjtx-<ver>-linux-x86_64-AppImage/*.AppImage
      #   artifacts/wsjtx-<ver>-linux-aarch64-AppImage/*.AppImage
      #   artifacts/wsjtx-<ver>-windows-x86_64-installer/*.exe
      #
      # Policy: publish only when all five platforms have produced an
      # installer-grade artifact. Adjust or remove this step if the
      # policy evolves (e.g. to publish any-platform-ready).
      - name: Verify installer-grade artifacts (all-platforms-ready gate)
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          shopt -s nullglob
          labels=(
            "macOS arm64 .pkg"
            "macOS x86_64 .pkg"
            "Linux x86_64 .AppImage"
            "Linux aarch64 .AppImage"
            "Windows x86_64 .exe"
          )
          patterns=(
            "artifacts/wsjtx-${VERSION}-arm64-macOS.pkg/*.pkg"
            "artifacts/wsjtx-${VERSION}-x86_64-macOS.pkg/*.pkg"
            "artifacts/wsjtx-${VERSION}-linux-x86_64-AppImage/*.AppImage"
            "artifacts/wsjtx-${VERSION}-linux-aarch64-AppImage/*.AppImage"
            "artifacts/wsjtx-${VERSION}-windows-x86_64-installer/*.exe"
          )
          missing=0
          echo "Installer-grade artifact gate — checking 5 platforms…"
          for i in "${!labels[@]}"; do
            # shellcheck disable=SC2206 # word-split is intentional; nullglob makes it safe.
            matches=( ${patterns[$i]} )
            if [ ${#matches[@]} -eq 0 ]; then
              echo "::error::MISSING  ${labels[$i]} — no match for ${patterns[$i]}"
              missing=$((missing + 1))
            else
              size=$(stat --printf '%s' "${matches[0]}")
              printf '  ok  %-22s %s (%s bytes)\n' "${labels[$i]}" "${matches[0]}" "$size"
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "::error::All-platforms-ready gate FAILED — $missing of 5 platform(s) missing installer-grade artifact."
            echo "::error::Refusing to publish a partial release. Fix the failing build job(s) and dispatch again — nothing was tagged."
            exit 1
          fi
          echo "All-platforms-ready gate PASSED — all 5 installer-grade artifacts present. Proceeding to publish."

      - name: Dry run — stopping before the tag
        if: inputs.dry_run
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: echo "::notice::Every installer built. A real run would now tag $TAG at $GITHUB_SHA and publish."

      # Only now, with every installer in hand, does the version become a tag.
      # It points at the commit the artifacts were built from — this run's
      # checkout, not wherever master has drifted to since.
      - name: Tag the commit that built
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${TAG}" \
            -f sha="${GITHUB_SHA}" > /dev/null
          echo "  ok  ${TAG} -> ${GITHUB_SHA}"

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          # Filter to user-facing release assets. `find artifacts -type f`
          # without filtering pulls in 5× ctest-results.xml (one per
          # platform) and per-binary tarballs from individual-binaries-*
          # that collide on basename across architectures — `gh release
          # create` uses basenames as asset names and duplicates cause
          # upload failures.
          #
          # Extension alone is not enough of a filter. It also matched every
          # utility built alongside WSJT-X — ft8code, jt65sim, wsprd and some
          # thirty more as *.tar.gz, plus bare wsjtx.exe and jt9.exe — which
          # left the download page carrying 46 files, nine of them the ones
          # anybody came for. Those utilities are developer tools; somebody
          # who needs them is building from source anyway.
          #
          # Requiring the release name prefix as well keeps exactly the
          # installers and the source tarball, all of which are named
          # wsjtx-<version>-..., and drops everything else.
          mapfile -t files < <(find artifacts -maxdepth 2 -type f \
            -name "wsjtx-${VERSION}*" \
            \( -name "*.pkg" -o -name "*.AppImage" -o -name "*.deb" \
               -o -name "*.exe" -o -name "*.tar.gz" -o -name "*.rpm" \))
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::Asset filter matched nothing — refusing to publish an empty release."
            exit 1
          fi
          printf 'attaching %d assets:\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"
          # SemVer pre-release tags contain a hyphen after the version
          # (e.g., v3.0.1-rc1, v3.0.1-rc2, v3.0.1-beta1). Flag those as
          # GitHub pre-releases so they don't appear as the latest stable.
          #
          # A fork release tag carries a hyphen too (build/vX.Y.Z-uahamN) and
          # must not be caught by that: it is a finished build, and marking it
          # a pre-release hides it from the one place an operator looks for
          # the download — the "Latest" release. Only rc and beta qualify.
          PRERELEASE_FLAG=""
          if [[ "$TAG" == *-* && ! "$TAG" =~ -uaham[0-9]+$ ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          # The description says what this build is and what was added to it.
          # Generated notes alone are a list of commit subjects, which answers
          # "what changed since last time" for somebody who already knows the
          # project — and nothing at all for the operator who arrived here to
          # download a program. The text lives in the repository so it can be
          # edited without touching this workflow.
          NOTES=$(mktemp)
          if [ -f .uaham/release-notes.md ]; then
            cat .uaham/release-notes.md > "$NOTES"
          else
            echo "::warning::.uaham/release-notes.md is missing — publishing with generated notes only"
          fi

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "WSJT-X ${{ needs.prepare.outputs.version }} (UaHamAward)" \
            --notes-file "$NOTES" \
            --generate-notes \
            $PRERELEASE_FLAG \
            "${files[@]}"


      # ── Public mirror: removed in this fork ────────────────────────────
      #
      # Upstream's release job ends by force-pushing HEAD to WSJTX/wsjtx's
      # master and creating a release there. That is right for the repository
      # that publishes WSJT-X and catastrophic here: this fork's master
      # carries changes nobody upstream agreed to, and the push is a --force.
      #
      # The steps were guarded by "the tag carries no hyphen", which a fork
      # release tag (build/vX.Y.Z-uahamN) never satisfies — but that is one
      # careless tag away from firing, and the only thing standing between it
      # and upstream's master would be the absence of a secret. Removed
      # outright instead. Contributions go upstream as pull requests.
